Button showcase · HTML
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Button Showcase</title>
<style>
  body {
    margin: 0;
    padding: 40px;
    background: #f5f5f5;
    font-family: Georgia, 'Times New Roman', serif;
  }
 
  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 30px 24px;
    background: #fff;
    border: 4px solid #f4a6c1;
    border-radius: 12px;
  }
 
  h2 {
    font-size: 1.5rem;
    margin: 0 0 16px 0;
    color: #000;
  }
 
  .section {
    margin-bottom: 36px;
  }
 
  /* Uber "Request Now" button */
  .request-now {
    background: #000;
    color: #fff;
    border: none;
    padding: 14px 28px;
    font-size: 0.95rem;
    font-family: Arial, Helvetica, sans-serif;
    border-radius: 4px;
    cursor: pointer;
  }
 
  /* Row holding Amazon + Hover me buttons */
  .button-row {
    display: flex;
    gap: 20px;
    align-items: center;
  }
 
  /* Amazon "Add to Cart" pill */
  .add-to-cart {
    background-color: #E9C349;
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 1rem;
    font-family: Arial, Helvetica, sans-serif;
    cursor: pointer;
  }
 
  /* "Hover me" button with light sweep */
  .hover-btn {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #2b2b2b 0%, #0d0d0d 60%);
    color: #fff;
    border: none;
    padding: 18px 40px;
    font-size: 1.1rem;
    font-family: Arial, Helvetica, sans-serif;
    border-radius: 8px;
    cursor: pointer;
  }
 
  .hover-btn .light {
    position: absolute;
    top: -200%;
    left: 0;
    width: 60%;
    height: 400%;
    background: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.32) 0%,
      rgba(255, 255, 255, 0) 90%
    );
    clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
    pointer-events: none;
    transform: translateX(-150%) rotate(20deg);
    opacity: 0;
    transition: transform 0.5s ease, opacity 0.5s ease;
  }
 
  .hover-btn:hover .light {
    transform: translateX(250%) rotate(20deg);
    opacity: 1;
  }
</style>
</head>
<body>
 
  <div class="container">
 
    <div class="section">
      <h2>Uber commercial button</h2>
      <button class="request-now">Request Now</button>
    </div>
 
    <div class="section">
      <h2>Amazon commercial button</h2>
      <div class="button-row">
        <button class="add-to-cart">Add to Cart</button>
        <button class="hover-btn">
          Hover me
          <div class="light"></div>
        </button>
      </div>
    </div>
 
  </div>
 
</body>
</html>
