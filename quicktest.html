<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Birthday &#128525;</title>
  <link rel="stylesheet" href="imageshapes.css">
<style>.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: auto auto;
  gap: 20px 40px;
  padding: 40px;
  border: 3px solid pink;
  border-radius: 12px;
  font-family: Georgia, 'Times New Roman', serif;
}

/* position each item on the grid to match the staggered layout */
.item-a   { grid-column: 1; grid-row: 1; text-align: left; }
.item-b   { grid-column: 3; grid-row: 1; text-align: left; }
.item-c-label { grid-column: 2; grid-row: 2; align-self: center; }
.item-c-img   { grid-column: 3; grid-row: 2; justify-self: center; }

/* image wrapper clips the zoom so it doesn't overflow the shape */
.img-wrap {
  overflow: hidden;
  width: 300px;
  height: 300px;
}

.img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}

.img-wrap img:hover {
  transform: scale(1.15);
}

.img-rounded {
  border-radius: 16px;
}

.img-circle {
  border-radius: 50%;
}</style>
</head>
<body>

  <div class="grid">

    <div class="photo-item item-a">
      <h3>A. Birthday shoot</h3>
      <div class="img-wrap img-rounded">
        <img class="shoot" src="thumbnails/birthdayshoot.png" alt="Birthday shoot">
      </div>
    </div>

    <div class="photo-item item-b">
      <h3>B. Outing</h3>
      <div class="img-wrap img-rounded">
        <img class="outing" src="thumbnails/headshot.png" alt="Outing">
      </div>
    </div>

    <div class="photo-item item-c-label">
      <h3>C. Thanksgiving</h3>
    </div>

    <div class="photo-item item-c-img">
      <div class="img-wrap img-circle">
        <img class="thanksgiving" src="thumbnails/thanksgiving.png" alt="Thanksgiving">
      </div>
    </div>

  </div>

  <div class="photo-item item-f">
  <h3>7f. LinkedIn signup</h3>
  <div class="linkedin-box">
    <label class="linkedin-label">Email</label>
    <input type="email" class="linkedin-input">
    <p class="linkedin-terms">By clicking Agree & Join, you agree to the Privacy Policy.</p>
    <button class="linkedin-submit">Agree & Join</button>
  </div>
  <div class="photo-item item-g">
  <h3>7g. Twitter text box</h3>
  <div class="twitter-box">
    <img src="thumbnails/avatar.png" class="twitter-avatar" alt="avatar">
    <span class="twitter-placeholder">What's happening?</span>
    <button class="twitter-tweet">Tweet</button>
  </div>
</div>
<style>
  .linkedin-box {
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 16px;
  width: 260px;
  font-family: Arial, Helvetica, sans-serif;
}

.linkedin-label {
  display: block;
  font-size: 0.85rem;
  margin-bottom: 4px;
  color: #333;
}

.linkedin-input {
  width: 100%;
  padding: 8px;
  border: 1px solid #333;
  border-radius: 4px;
  box-sizing: border-box;
  margin-bottom: 12px;
}

.linkedin-terms {
  font-size: 0.75rem;
  color: #666;
  margin: 0 0 16px 0;
}

.linkedin-submit {
  width: 100%;
  background-color: rgb(6, 41, 74);
  color: white;
  border: none;
  padding: 12px;
  border-radius: 25px;
  font-weight: bold;
  cursor: pointer;
  padding: 0.75rem 1.5rem;
}
.twitter-box {
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 12px 16px;
  width: 400px;
  display: flex;         /* flex handles vertical centering better than vertical-align in most cases */
  align-items: center;
  gap: 12px;
  font-family: Arial, Helvetica, sans-serif;
}

.twitter-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
  vertical-align: middle;
}

.twitter-placeholder {
  flex: 1;
  color: #888;
  vertical-align: middle;
}

.twitter-tweet {
  background-color: rgb(29, 155, 240);
  color: white;
  border: none;
  padding: 8px 20px;
font-size: clamp(24px,5vw,64px); /*test for fontsize*/
  border-radius: 25px;
  font-weight: bold;
  cursor: pointer;
  vertical-align: middle;
}


</style>
</body>
</html>
