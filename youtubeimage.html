}
.body{
  display: flex ;
  /*gap: 10px;*/
}
.youtube-container{
  background-color: rgb(235, 233, 233);
  width: 300px;
  display: inline-block;
  margin-right: 15px;
}
.search-bar{
  font-size: 10px;
  height: 30px;
  margin-left: 12px;
  padding-left: 6px;
  border-radius: 5px;
  border: 1px solid #999;
 border-color: rgb(106, 106, 107);
 outline: none;
 display: inline-block;
 justify-content: center;
 align-items: center;
 
}
.youtube-info{
  display: flex;
}

.profilepic{
  width: 40px;
  border-radius: 50%;
  height: 40px;
  object-fit: cover;
  object-position:top;
  vertical-align: middle;
  margin-left: 5px;
}

.youtube-views,
.youtube-author{
display: block; 
width: 220px;
color: rgb(96,96,96);
margin-left: 10px;
  font-weight: 400;
  font-size: 12px;

} 

.youtube-author{margin-bottom: -7px;}
.youtube-title{
  width: 240px;
  margin-left: 10px;
  font-weight: 500; 
  font-size: small;
  color: rgb(0, 0, 0);
  line-height: 20px
}

.pic{
  margin-top: 15px;
}
