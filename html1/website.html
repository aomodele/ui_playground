<!DOCTYPE html>
<html>
<head>
<title>Website</title> <link rel="stylesheet" href="website.css">
</head>
<body>

  <div class="grid">

    <div class="card">
      <h3>3a. Uber</h3>
      <div class="box">
        <button class="uber-button" onclick=" alert('Ride requested')">Request now</button>
      </div>
      <div class="caption">(opacity)</div>
    </div>

    <div class="card">
      <h3>3b. Amazon</h3>
      <div class="box">
        <button class="amazon-button" onclick=" alert('Item added')"  >Add to Cart</button>
     
      </div>
      
      <div class="caption">(background color)</div>
    </div>

    <div class="card">
      <h3>3c. GitHub</h3>
      <div class="box">
        <button class="github-button" onclick=" alert('Signin to share projects')">Sign up</button>
      </div>
      <div class="caption">(shadow)</div>
    </div>

    <div class="card">
      <h3>3d. Bootstrap</h3>
      <div class="box">
        <button class="bootstrap-primary">Get started</button>
        <button class="bootstrap-secondary">Download</button>
      </div>
    </div>

    <div class="card">
      <h3>3e. LinkedIn</h3>
      <div class="box">
        <button class="linkedin-primary">Apply on company website</button>
        <button class="linkedin-secondary">Save</button>
      </div>
    </div>

  </div>
<div class="card"> <!-- Claudetest -->

  <a href="#" class="back-link">Back to Amazon</a>
  <h1 class="product-title">Nike Black Running Shoes</h1>
  <p class="price">$39 - in stock.</p>
  <p class="delivery">Free delivery tomorrow.</p>

  <div class="buttons">
    <button class="add-to-cart" onclick="console.log('Loading...'); alert('Added')">Add to Cart</button>
    <button class="buy-now" onclick="console.log('Loading...');
        alert('Purchased')">Buy now</button>
  </div>
</div>
</body>
</html>
